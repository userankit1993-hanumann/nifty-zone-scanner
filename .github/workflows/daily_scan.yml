name: Daily 4:00 PM Zone Scanner

on:
  schedule:
    # 10:32 AM UTC = 4:02 PM IST (Monday to Friday)
    - cron: '32 10 * * 1-5'
  workflow_dispatch:

jobs:
  run-scan:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: pip install -r requirements.txt

      - name: Run Zone Scanner Script
        run: python daily_scanner.py

      - name: Commit & Push Updated JSON Data
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add scan_results.json
          git commit -m "Auto-update 4:00 PM zone classification" || exit 0
          git push
