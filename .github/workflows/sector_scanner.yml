name: Separate Sector Indices Scan

on:
  schedule:
    # 10:00 AM UTC = 3:30 PM IST (Mon-Fri)
    - cron: '0 10 * * 1-5'
  workflow_dispatch:        # Manual trigger button in Actions tab

jobs:
  run-sector-scan:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          pip install yfinance pandas requests

      - name: Run Sector Scanner
        run: python sector_scanner.py

      - name: Commit and Push Sector Results
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add sector_results.json
          git commit -m "Automated update for Sector Indices JSON" || exit 0
          git push
