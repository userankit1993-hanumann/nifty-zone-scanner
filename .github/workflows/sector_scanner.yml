name: Separate Sector Indices Scan

on:
  schedule:
    # 2:32 PM UTC = 8:02 PM IST (Mon-Fri)
    - cron: '32 14 * * 1-5'
  workflow_dispatch:

jobs:
  run-sector-scan:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          pip install yfinance pandas requests

      - name: Run Sector Scanner
        run: python sector_scanner.py

      - name: Commit and Push Sector Results
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add sector_results.json
          git commit -m "Auto-update sector scan results at 8:00 PM IST" || exit 0
          git push
